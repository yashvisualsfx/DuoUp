<h3 style="margin:22px 0 10px">${L.total?L.total+(L.total>1?" people":" person")+" liked you":"Likes you receive show up here"}</h3><div class="bl ${S.tier?"":"lk"}">${S.tier?L.people.slice(0,8).map(p=>`<div style="${avs(p.name,p.photo)};color:#fff">${ini(p.name,p.photo)}<small>${esc(p.name)}, ${p.age}</small></div>`).join(""):Array(Math.min(L.total,4)).fill(0).map(()=>`<div>?<small>Hidden</small></div>`).join("")}</div>${!S.tier&&L.total?`<button class="btn w" style="margin-top:12px" onclick="buy('Premium')">Unlock with Premium</button>`:""}`}
if(S.tab=="p"){const u=S.u,ph=u.photos;v.innerHTML=`<div class="pl" style="text-align:center"><div class="av" style="width:90px;height:90px;font-size:40px;margin:auto;${avs(u.full,ph[0])}">${ini(u.full,ph[0])}</div><h2 style="margin-top:10px;font-size:24px">${esc(dn())}, ${u.age}</h2><div class="mu">${esc(u.games||"")} · ${esc(u.pl||"")}${S.tier?" · "+S.tier:""}</div></div>
<div class="pl"><div class="lb" style="margin-top:0">Photos (${ph.length}/6)</div><div class="pg3">${[0,1,2,3,4,5].map(i=>ph[i]?`<div class="ph3" style="background-image:url('${ph[i]}')">${i?"":"<em>Main</em>"}<button class="r" onclick="addPh(${i})" aria-label="Replace">↻</button><button class="x" onclick="delPh(${i})" aria-label="Delete">✕</button></div>`:(i==ph.length?`<button class="ph3 add" onclick="addPh(${i})">+</button>`:`<div class="ph3 off"></div>`)).join("")}</div><p class="mu" style="font-size:12px;margin:10px 0 0">Tap + to add, ↻ to replace, ✕ to delete.</p></div>
<div class="pl"><div class="lb" style="margin-top:0">Nickname</div><input class="i" style="margin:0" maxlength="20" value="${esc(u.nick)}" placeholder="How others see you" oninput="S.u.nick=this.value"><div class="lb">City</div><input class="i" style="margin:0" maxlength="40" value="${esc(u.city)}" placeholder="Optional" oninput="S.u.city=this.value"><div class="lb">Bio</div><textarea class="i" style="margin:0" maxlength="160" placeholder="Tell players about your playstyle" oninput="S.u.bio=this.value;$('#bc').textContent=this.value.length+'/160'">${esc(u.bio)}</textarea><div class="mu" id="bc" style="font-size:12px;text-align:right;margin-top:4px">${u.bio.length}/160</div>
<div class="lb">Looking for (pick any)</div>${INT().map(x=>chip(x,u.intent.includes(x),`tgl('intent','${x}')`)).join("")}<div class="lb">Interested in</div>${["Male","Female","Both"].map(x=>chip(x,u.interest==x,`pick('interest','${x}')`)).join("")}<div class="lb">Game</div>${gchips()}${idbox()}<div class="lb">Rank</div>${RANKS.map(x=>chip(x,u.rank==x,`pick('rank','${x}')`)).join("")}<div class="lb">Role</div>${ROLES.map(x=>chip(x,u.role==x,`pick('role','${x}')`)).join("")}${lchips()}<button class="btn w" style="margin-top:20px" onclick="saveBtn()">Save changes</button></div>`}}
async function saveBtn(){if(!gamesOk())return toast("Add your in-game ID");if(await save(false))toast("Profile saved ✓")}
/* photos: compressed in the browser, stored in Supabase Storage */
function addPh(i){S.pi=i;$("#fi").click()}
const squash=f=>new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,1080/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.85)};im.onerror=rej;im.src=u});
const rmFile=u=>{const p=(u||"").split("/object/public/photos/")[1];if(p)SB.storage.from("photos").remove([p])};
async function onPh(inp){const f=inp.files[0];inp.value="";if(!f||!f.type.startsWith("image/"))return toast("Please choose an image");toast("Uploading…");
 try{const b=await squash(f),path=`${S.uid}/${Date.now()}.jpg`,{error}=await SB.storage.from("photos").upload(path,b,{contentType:"image/jpeg"});if(error)throw error;
 const url=SB.storage.from("photos").getPublicUrl(path).data.publicUrl,a=S.u.photos;let old;if(S.pi<a.length){old=a[S.pi];a[S.pi]=url}else a.push(url);
 const r=await SB.from("profiles").update({photos:a}).eq("id",S.uid);if(r.error)throw r.error;if(old)rmFile(old);view();toast("Photo saved")}catch(e){toast("Upload failed. Try another photo.")}}
async function delPh(i){const[old]=S.u.photos.splice(i,1);await SB.from("profiles").update({photos:S.u.photos}).eq("id",S.uid);rmFile(old);view();toast("Photo deleted")}
/* ===== actions ===== */
async function act(like){const p=S.deck[0];if(!p)return;if(!S.tier&&like&&S.used>=20)return paywall();const c=$("#pc");c.classList.add(like?"or":"ol");
 const{data,error}=await SB.rpc("swipe",{p_to:p.id,p_like:like});
 if(error){c.classList.remove("or","ol");return toast("Couldn’t save that. Try again.")}
 if(data.limit){c.classList.remove("or","ol");S.used=20;return paywall()}
 S.deck.shift();if(like)S.used=data.used;
 setTimeout(()=>{app();if(data.matched){toast("🎉 It’s a match with "+p.n+"!");loadMatches()}else if(like&&!S.tier&&S.used>=20)setTimeout(paywall,500);if(S.deck.length<3)loadDeck()},280)}
function paywall(){ov(`<h3>You’ve used your 20 free likes today</h3><p class="mu">Go premium to keep connecting.</p><ul style="padding-left:18px;line-height:1.9"><li>Unlimited likes</li><li>See everyone who liked you</li><li>Profile boosts and priority placement</li><li>Verified rank badge (Max)</li></ul><button class="btn w glow" onclick="buy('Premium')">Premium · ₹${PRICE.Premium}/month</button><button class="btn w" style="margin-top:10px;background:var(--ac2)" onclick="buy('Max')">Premium Max · ₹${PRICE.Max}/month</button><button class="ghost w" style="margin-top:10px;border:0" onclick="ov()">Maybe later</button>`,1)}
function buy(t){if(S.tier==t)return toast("This plan is already active");ov(`<h3>Get ${t}</h3><p class="mu">₹${PRICE[t]}/month. Online payments are being set up. Send an upgrade request and we’ll activate your plan once payment is confirmed.</p><button class="btn w" onclick="reqUp('${t}')">Send upgrade request</button><button class="ghost w" style="margin-top:10px;border:0" onclick="ov()">Not now</button>`,1)}
async function reqUp(t){const{error}=await SB.from("upgrade_requests").insert({user_id:S.uid,tier:t});ov();toast(error?em(error):"Request sent. We’ll activate your plan soon.")}
async function rep(id){const{error}=await SB.rpc("report_user",{p_id:id,p_reason:"Reported from Discover"});if(error)return toast(em(error));S.deck=S.deck.filter(x=>x.id!=id);toast("Reported. Our team will review it.");view()}
function filt(){const F=S.F,row=(k,a)=>a.map(x=>chip(x,F[k]==x,`F.${k}=F.${k}=='${x}'?'':'${x}';filt()`)).join("");
 ov(`<h3>Filters</h3><div class="lb">Game</div>${row("gm",["BGMI","Free Fire"])}<div class="lb">Show me</div>${row("g",["Male","Female","Both"])}<div class="lb">Intent</div>${row("i",INT())}<div class="lb">Rank</div>${row("r",RANKS)}<div class="lb">Language</div>${row("l",LANGS)}<button class="btn w" style="margin-top:14px" onclick="ov();app();loadDeck()">Show results</button><button class="ghost w" style="margin-top:8px;border:0" onclick="S.F={gm:'',g:'',i:'',l:'',r:''};filt()">Reset</button>`,1)}
async function openChat(id){S.open=id;if(!S.msgs[id]){const{data}=await SB.from("messages").select("*").eq("match_id",id).order("created_at").limit(200);S.msgs[id]=data||[]}view()}
async function snd(){const i=$("#mi"),t=i.value.trim();if(!t)return;i.value="";i.focus();const{data,error}=await SB.from("messages").insert({match_id:S.open,sender_id:S.uid,body:t}).select().single();if(error){i.value=t;return toast("Message not sent")}if(pushMsg(data))addBubble(data)}
async function showIds(oid){const{data}=await SB.from("game_ids").select("*").eq("user_id",oid).maybeSingle(),row=(l,v)=>v?`<div class="li" style="margin-top:10px"><div style="flex:1"><div class="mu" style="font-size:12px">${l}</div><b>${esc(v)}</b></div><button class="ghost sm" onclick="navigator.clipboard.writeText('${esc(v).replace(/'/g,"")}');toast('Copied')">Copy</button></div>`:"";
 ov(`<h3>Game IDs</h3>${row("BGMI ID",data&&data.bgmi_id)}${row("Free Fire UID",data&&data.ff_uid)}${data&&(data.bgmi_id||data.ff_uid)?"":'<p class="mu">No IDs shared yet.</p>'}<button class="ghost w" style="margin-top:14px;border:0" onclick="ov()">Close</button>`,1)}
/* ===== menu / settings ===== */
function menu(){ov(`<h3>Menu</h3><div class="mn">${[["⚙️","Settings","settings()"],["🔒","Privacy Policy","doc('privacy')"],["📄","Terms &amp; Conditions","doc('terms')"],["✉️","Contact us","contact()"],...(S.isAdmin?[["🛠️","Admin panel","S.at='o';go('admin')"]]:[])].map(m=>`<button onclick="${m[2]}"><span>${m[0]}</span>${m[1]}</button>`).join("")}</div>`,1)}
function settings(){ov(`<h3>Settings</h3><div class="lb">Theme</div>${THEMES.map(t=>chip(t[1],S.theme==t[0],`setTheme('${t[0]}');settings()`)).join("")}<div class="lb">Account</div><div class="mn"><button onclick="chPw()"><span>🔑</span>Change password</button><button onclick="confirmBox('Deactivate account?','Your profile will be hidden. Log in anytime to reactivate.','Deactivate','deact()')"><span>⏸️</span>Deactivate account</button><button style="color:#e5484d" onclick="confirmBox('Delete account?','This permanently deletes your profile, photos and chats. This can’t be undone.','Delete forever','delAcc()')"><span>🗑️</span>Delete account</button><button onclick="out()"><span>🚪</span>Log out</button></div>`,1)}
function confirmBox(t,m,b,fn){ov(`<h3>${t}</h3><p class="mu">${m}</p><button class="btn w" style="background:#e5484d;color:#fff" onclick="${fn}">${b}</button><button class="ghost w" style="margin-top:10px;border:0" onclick="settings()">Cancel</button>`,1)}
const out=()=>SB.auth.signOut();
async function deact(){await SB.from("profiles").update({status:"deactivated"}).eq("id",S.uid);toast("Account deactivated");out()}
async function delAcc(){const{data}=await SB.storage.from("photos").list(S.uid);if(data&&data.length)await SB.storage.from("photos").remove(data.map(f=>`${S.uid}/${f.name}`));const{error}=await SB.rpc("delete_me");if(error)return toast(em(error));toast("Account deleted");out()}
function chPw(){ov(`<h3>Change password</h3><input class="i" id="p0" type="password" placeholder="Current password"><input class="i" id="p1" type="password" placeholder="New password (6+ characters)"><input class="i" id="p2" type="password" placeholder="Confirm new password"><button class="btn w" style="margin-top:16px" onclick="savePw()">Update password</button><button class="ghost w" style="margin-top:10px;border:0" onclick="settings()">Cancel</button>`,1)}
async function savePw(){const a=$("#p0").value,b=$("#p1").value;if(b.length<6)return toast("New password needs 6+ characters");if(b==a)return toast("Choose a different password");if(b!=$("#p2").value)return toast("Passwords don’t match");
 const{error:e1}=await SB.auth.signInWithPassword({email:S.u.email,password:a});if(e1)return toast("Current password is incorrect");const{error}=await SB.auth.updateUser({password:b});if(error)return toast(em(error));ov();toast("Password updated")}
function newPw(){ov(`<h3>Set a new password</h3><input class="i" id="p1" type="password" placeholder="New password (6+ characters)"><button class="btn w" style="margin-top:16px" onclick="setNew()">Save password</button>`,1)}
async function setNew(){const b=$("#p1").value;if(b.length<6)return toast("Password needs 6+ characters");const{error}=await SB.auth.updateUser({password:b});if(error)return toast(em(error));ov();toast("Password updated")}
function contact(){ov(`<h3>Contact us</h3><p class="mu" style="margin:0">Questions, feedback or a problem? Send us a message.</p><input class="i" id="ce" type="email" placeholder="Your email" value="${esc(S.u.email)}"><textarea class="i" id="cm" maxlength="2000" placeholder="How can we help?"></textarea><button class="btn w" style="margin-top:14px" onclick="sendContact()">Send message</button>`,1)}
async function sendContact(){const m=$("#cm").value.trim(),e=$("#ce").value.trim();if(!m)return toast("Please write a message");if(!CFG_OK)return needCfg();const{error}=await SB.from("contact_messages").insert({user_id:S.uid,email:e,message:m});if(error)return toast(em(error));ov();toast("Message sent. We’ll reply by email.")}
/* ===== admin (needs profiles.is_admin = true) ===== */
const aframe=b=>`<div class="app"><div class="tb"><h2 class="lg">Admin panel</h2><button class="pill" onclick="go('app')">Exit</button></div><div class="pad" style="padding-bottom:0">${[["o","Overview"],["u","Users"],["r","Reports"],["q","Upgrades"]].map(t=>chip(t[1],S.at==t[0],`S.at='${t[0]}';admin()`)).join("")}</div><div class="pad stg">${b}</div></div>`;
async function admin(){const A=S.at;$("#root").innerHTML=aframe('<p class="mu">Loading…</p>');let b="";
 if(A=="o"){const{data:s,error}=await SB.rpc("admin_stats");if(error){S.screen="app";return toast("Admins only")}const mx=Math.max(1,s.bgmi,s.ff);
  b=`<div class="ag">${[["Total users",s.users],["Banned",s.banned],["Open reports",s.reports],["Premium members",s.premium],["Matches",s.matches],["Messages",s.messages]].map(x=>`<div class="pl"><div class="mu" style="font-size:13px">${x[0]}</div><div class="pz">${x[1]}</div></div>`).join("")}</div><div class="pl"><h3>Players by game</h3>${[["BGMI",s.bgmi],["Free Fire",s.ff]].map(g=>`<div class="mu" style="margin-top:12px">${g[0]} · ${g[1]}</div><div class="bar"><i style="width:${g[1]/mx*100}%"></i></div>`).join("")}</div>`}
 if(A=="u"){const{data}=await SB.from("profiles").select("id,full_name,nickname,dob,games,status,verified,tier").order("created_at",{ascending:false}).limit(100);
  b=(data||[]).map(p=>`<div class="li"><div style="flex:1;min-width:0"><b>${esc(p.nickname||p.full_name||"New user")}${p.verified?" ✔":""}</b><div class="mu" style="font-size:13px">${p.dob?ageOf(p.dob):"?"} · ${esc(p.games||"—")} · ${p.tier||"Free"}${p.status!="active"?" · "+p.status:""}</div></div><button class="ghost sm" onclick="adm('${p.id}',{verified:${!p.verified}})">${p.verified?"Unverify":"Verify"}</button><button class="ghost sm" style="color:#e5484d;margin-left:6px" onclick="adm('${p.id}',{status:'${p.status=="banned"?"active":"banned"}'})">${p.status=="banned"?"Unban":"Ban"}</button></div>`).join("")||'<p class="mu">No users yet.</p>'}
 if(A=="r"){const{data}=await SB.from("reports").select("id,reason,created_at,reported_id,reporter:profiles!reporter_id(full_name),reported:profiles!reported_id(full_name)").eq("status","open").order("created_at",{ascending:false});
  b=(data||[]).map(r=>`<div class="li"><div style="flex:1;min-width:0"><b>${esc(r.reported?r.reported.full_name:"Unknown")}</b><div class="mu" style="font-size:13px">Reported by ${esc(r.reporter?r.reporter.full_name:"Unknown")} · ${new Date(r.created_at).toLocaleDateString()}</div></div><button class="ghost sm" onclick="rpt('${r.reported_id}',${r.id},0)">Dismiss</button><button class="ghost sm" style="color:#e5484d;margin-left:6px" onclick="rpt('${r.reported_id}',${r.id},1)">Ban</button></div>`).join("")||`<div class="pl" style="text-align:center"><h3>No open reports</h3></div>`}
 if(A=="q"){const{data}=await SB.from("upgrade_requests").select("id,tier,user_id,created_at,p:profiles!user_id(full_name)").eq("status","open").order("created_at");
  b=(data||[]).map(r=>`<div class="li"><div style="flex:1;min-width:0"><b>${esc(r.p?r.p.full_name:"Unknown")}</b><div class="mu" style="font-size:13px">Wants ${r.tier} · ${new Date(r.created_at).toLocaleDateString()}</div></div><button class="ghost sm" onclick="upg(${r.id},'${r.user_id}','${r.tier}',1)">Approve</button><button class="ghost sm" style="margin-left:6px" onclick="upg(${r.id},'${r.user_id}','${r.tier}',0)">Reject</button></div>`).join("")||`<div class="pl" style="text-align:center"><h3>No open requests</h3><p class="mu">Approve only after you’ve received payment.</p></div>`}
 if(S.screen=="admin")$("#root").innerHTML=aframe(b)}
async function adm(id,patch){const{error}=await SB.from("profiles").update(patch).eq("id",id);if(error)toast(em(error));admin()}
async function rpt(id,rid,ban){if(ban)await SB.from("profiles").update({status:"banned"}).eq("id",id);await SB.from("reports").update({status:ban?"actioned":"dismissed"}).eq("id",rid);admin()}
async function upg(id,uid,tier,ok){if(ok)await SB.from("profiles").update({tier}).eq("id",uid);await SB.from("upgrade_requests").update({status:ok?"approved":"rejected"}).eq("id",id);admin()}
function render(){S.screen=="land"?landing():S.screen=="onb"?onb(1):S.screen=="admin"?admin():app();scrollTo(0,0)}
async function boot(){const{data:{session}}=await SB.auth.getSession();session?enter(session.user):render()}
if(CFG_OK){SB.auth.onAuthStateChange((ev)=>{if(ev=="SIGNED_OUT")reset();if(ev=="PASSWORD_RECOVERY")setTimeout(newPw,400)});boot()}
else{render();document.body.insertAdjacentHTML("beforeend",'<div class="cfgb">Backend not connected yet. Add your Supabase URL and key at the top of this file (README step 3).</div>')}
</script></body></html>
